services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ceeq
      POSTGRES_PASSWORD: ceeq
      POSTGRES_DB: ceeq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
